---
# =====================================================================
# Install Kubernetes packages and preload system images.
#
# Offline constraints:
#   - All .debs come from the bastion; nodes have no internet.
#   - All container images must be preloaded; kubeadm cannot pull.
#
# Order matters:
#   1. Helpers first (conntrack, socat, ebtables, ipset).
#   2. Kubernetes CNI (brings /opt/cni/bin).
#   3. kubeadm, kubelet, kubectl.
#   4. Hold all packages.
#   5. Stop kubelet until kubeadm tells it what to do.
#   6. Preload k8s system images into containerd.
# =====================================================================

- name: Ensure staging .deb directory exists
  ansible.builtin.file:
    path: "{{ node_debs_dir }}"
    state: directory
    mode: "0755"

- name: Ensure staging images directory exists
  ansible.builtin.file:
    path: "{{ k8s_images_dir }}"
    state: directory
    mode: "0755"

- name: Download helper .deb files from the bastion
  ansible.builtin.get_url:
    url: "{{ artifact_debs_url }}/{{ item }}"
    dest: "{{ node_debs_dir }}/{{ item }}"
    mode: "0644"
    force: false
  loop: "{{ helper_deb_files }}"

- name: Download Kubernetes .deb files from the bastion
  ansible.builtin.get_url:
    url: "{{ artifact_debs_url }}/{{ item }}"
    dest: "{{ node_debs_dir }}/{{ item }}"
    mode: "0644"
    force: false
  loop:
    - "{{ kubernetes_cni_deb_file }}"
    - "{{ kubeadm_deb_file }}"
    - "{{ kubelet_deb_file }}"
    - "{{ kubectl_deb_file }}"

# ---------------------------------------------------------------------
# Install .debs idempotently via the apt module.
# 'apt: deb=...' knows whether the package is already present at the
# same version, so re-running reports ok rather than changed.
# ---------------------------------------------------------------------

- name: Install helper packages from local .deb
  ansible.builtin.apt:
    deb: "{{ node_debs_dir }}/{{ item }}"
    state: present
  loop: "{{ helper_deb_files }}"

- name: Install kubernetes-cni from local .deb
  ansible.builtin.apt:
    deb: "{{ node_debs_dir }}/{{ kubernetes_cni_deb_file }}"
    state: present

- name: Install kubeadm from local .deb
  ansible.builtin.apt:
    deb: "{{ node_debs_dir }}/{{ kubeadm_deb_file }}"
    state: present

- name: Install kubelet from local .deb
  ansible.builtin.apt:
    deb: "{{ node_debs_dir }}/{{ kubelet_deb_file }}"
    state: present

- name: Install kubectl from local .deb
  ansible.builtin.apt:
    deb: "{{ node_debs_dir }}/{{ kubectl_deb_file }}"
    state: present

- name: Hold Kubernetes and container runtime packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kube_held_packages }}"

# ---------------------------------------------------------------------
# Ensure kubelet is stopped and disabled, but only change state when
# it needs changing. This avoids reporting 'changed' on every run.
# ---------------------------------------------------------------------

- name: Check kubelet service state
  ansible.builtin.command:
    cmd: systemctl is-active kubelet
  register: kubelet_state
  changed_when: false
  failed_when: false

- name: Stop kubelet before it has any config
  ansible.builtin.systemd:
    name: kubelet
    state: stopped
    enabled: false
  when: kubelet_state.stdout != "inactive"

- name: Verify kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: kubeadm_version
  changed_when: false

- name: Show kubeadm version
  ansible.builtin.debug:
    var: kubeadm_version.stdout

- name: Download Kubernetes system images tar from the bastion
  ansible.builtin.get_url:
    url: "{{ artifact_images_url }}/{{ k8s_images_tar }}"
    dest: "{{ k8s_images_dir }}/{{ k8s_images_tar }}"
    mode: "0644"
    force: false

- name: Check which Kubernetes images are already in containerd
  ansible.builtin.command:
    cmd: "ctr -n k8s.io images ls -q"
  register: existing_images
  changed_when: false

- name: Import Kubernetes system images into containerd
  ansible.builtin.command:
    cmd: "ctr -n k8s.io image import {{ k8s_images_dir }}/{{ k8s_images_tar }}"
  register: image_import
  changed_when: image_import.rc == 0
  when: >-
    k8s_system_images
    | reject('in', existing_images.stdout_lines)
    | list
    | length > 0

- name: Verify all expected Kubernetes images are present
  ansible.builtin.command:
    cmd: "ctr -n k8s.io images ls -q"
  register: images_after
  changed_when: false

- name: Fail if any Kubernetes image is missing
  ansible.builtin.fail:
    msg: "Missing image: {{ item }}"
  when: item not in images_after.stdout
  loop: "{{ k8s_system_images }}"

- name: Show final image list
  ansible.builtin.debug:
    var: images_after.stdout_lines
