---
# =====================================================================
# Self-hosted GitOps platform
# Top-level orchestration playbook.
# =====================================================================

- name: Base OS preparation for all Kubernetes nodes
  hosts: k8s
  become: true
  tags: [base]
  roles:
    - base

- name: containerd on all Kubernetes nodes
  hosts: k8s
  become: true
  tags: [containerd]
  roles:
    - containerd

- name: Kubernetes packages on all Kubernetes nodes
  hosts: k8s
  become: true
  tags: [kubernetes]
  roles:
    - kubernetes

