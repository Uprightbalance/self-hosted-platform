---
# =====================================================================
# Self-hosted GitOps platform
# Top-level orchestration playbook.
#
# Usage:
#   ansible-playbook site.yml                     # full build
#   ansible-playbook site.yml --tags base         # one stage only
#   ansible-playbook site.yml --limit control-plane
# =====================================================================

- name: Base OS preparation for all Kubernetes nodes
  hosts: k8s
  become: true
  tags: [base]
  roles:
    - base

- name: containerd on all Kubernetes nodes
  hosts: k8s
  become: true
  tags: [containerd]
  roles:
    - containerd

